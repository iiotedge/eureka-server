name: Release

# Three stages, each gating the next:
#   test            - full mvn verify - the actual quality gate, never
#                      skipped to make the container build easier
#   build-and-push   - packages the jar `test` already built and verified
#                      (not a fresh rebuild) into the production Dockerfile,
#                      scans it, pushes to GHCR - except on pull_request,
#                      where it still builds (catches a broken Dockerfile
#                      in review) but never pushes
#   release          - only on a version tag: creates the GitHub Release
#
# This service's parent (iiotedge-parent) resolves from GitHub Packages
# over the network - no monorepo checkout needed, and no dependency on the
# separate `common` repo either.
#
# REQUIRES a repo secret PLATFORM_REPO_TOKEN - a PAT (classic; fine-grained
# PATs don't support GitHub Packages registry auth) with read:packages on
# iiotedge/platform-build. (GITHUB_TOKEN, provided automatically, is used
# for GHCR push.)

on:
  push:
    branches: [main]
    tags: ['v*.*.*', '20*.*.*']
  pull_request:
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/iiotedge/eureka-server
  JAVA_VERSION: '21'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Write GitHub Packages settings.xml
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          SETTINGS="$RUNNER_TEMP/gpr-settings.xml"
          cat > "$SETTINGS" <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          echo "GPR_SETTINGS=$SETTINGS" >> "$GITHUB_ENV"

      - name: Build & verify
        run: mvn -B -s "$GPR_SETTINGS" clean verify

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: eureka-server-jar
          path: target/eureka-server.jar
          retention-days: 7

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout (Dockerfile only - jar comes from the test job)
        uses: actions/checkout@v4

      - name: Record build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: eureka-server-jar
          path: target

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=eureka-server
          cache-to: type=gha,mode=max,scope=eureka-server

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=eureka-server

  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Image: \`${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}\` (also tagged \`sha-${GITHUB_SHA}\`)"
