spring:
  application:
    name: eureka-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    prefer-ip-address: true
  client:
    # This instance IS the registry - it doesn't register with or fetch
    # from itself. A peer profile (application-peer1.yml/-peer2.yml)
    # flips both of these to true when actually running as part of a
    # real multi-node cluster.
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        # Was health,info only - added prometheus (the dependency to back
        # it was previously absent entirely, not just unconfigured).
        # Deliberately not wider than this - see SecurityConfig, only
        # /actuator/health is unauthenticated, so exposure width here
        # doesn't equal public exposure the way it would without that.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
